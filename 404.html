<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Blue</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500&display=swap">
<style>
:root { --paper: #F6F8FC; --ink: #0E1A33; --muted: #5A6478; --blue: #2450E0; --core: #0E1A33; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --paper: #0B1530; --ink: #F2F5FC; --muted: #A9B4CC; --blue: #A8C3FF; --core: #FFFFFF; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 400 17px/1.6 'Inter', system-ui, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
svg { width: 96px; height: 96px; }
h1 { margin: 24px 0 8px; font: 600 36px/1.1 'Space Grotesk', Arial, sans-serif; letter-spacing: -0.02em; }
p { margin: 0; color: var(--muted); }
a { color: var(--blue); font-weight: 500; }
</style>
</head>
<body>
<main>
  <svg viewBox="10 10 80 80" role="img" aria-label="Blue logo with the message missing">
    <circle cx="50" cy="50" r="34" fill="none" style="stroke: var(--blue)" stroke-width="12" stroke-linecap="round" stroke-dasharray="180 33.6" transform="rotate(-60 50 50)"/>
    <circle cx="50" cy="50" r="12" style="fill: var(--core)"/>
  </svg>
  <h1>This message never arrived</h1>
  <p>There's no page at this address. <a href="/">Go to the Blue homepage</a>.</p>
</main>
</body>
</html>
